<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" src="style.css">
    <title>GameLog</title>
    <script src="js/app.js"></script>
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
	  <header class="cabecera">
		  <h1>GameLog</h1>
		  <nav>
			  <ul>
				  <li><button>Todos</button></li>
				  <li><button>Pendiente</button></li>
				  <li><button>Jugando</button></li>
				  <li><button>Completado</button></li>
			  </ul>
		  </nav>
	  </header>

	  <main class="main-box">
		  <h2>Añadir Nuevo Juego</h2>

		  <form>
			  <label for="Name">Título:</label>
			  <input type="text" id="Name" name="Name">
			  <label for="Platform">Plataforma:</label>
			  <select id="Platform" name="platform">
				  <option>PC</option>
				  <option>PlayStation</option>
				  <option>Xbox</option>
				  <option>Nintendo</option>
			  </select>
			  <label for="State">Estado:</label>
			  <select id="State" name="status">
				  <option>Pendiente</option>
				  <option>Jugando</option>
				  <option>Completado</option>
			  </select>
			  <label for="Score">Puntuación del 1 al 10</label>
			  <input type="number" id="Score" min="1" max="10" name="Score">
			  <button type="submit">Añadir Juego</button>
			 
		  </form>


		  <section>
			  <h2>Biblíoteca</h2>
			  <article class="card-game">
				  <h3>Fifa 23</h3>
				  <p><strong>Plataforma:</strong> PlayStation</p>
				  <p><strong>Estado:</strong> Jugando</p>
				  <p><strong>Puntuación:</strong> 8/10</p>
				  <div class="card-actions">
					  <button type="button">Editar</button>
					  <button type="button">Eliminar</button>
				  </div>

			  </article>

			  <article class="card-game">
				  <h3>Expedition 33</h3>
				  <p><strong>Plataforma:</strong> Pc</p>
				  <p><strong>Estado:</strong> Pendiente</p>
				  <p><strong>Puntuación:</strong> 10/10</p>
				  <div class="card-actions">
					  <button type="button">Editar</button>
					  <button type="button">Eliminar</button>

				  </div>

			  </article>

			  <article class="card-game">
				  <h3>Halo</h3>
				  <p><strong>Plataforma:</strong> Xbox</p>
				  <p><strong>Estado:</strong> Completado</p>
				  <p><strong>Puntuación:</strong> 8/10</p>
				  <div class="card-actions">
					  <button type="button">Editar</button>
					  <button type="button">Eliminar</button>
				  </div>

			  </article>

		  </section>

	  </main>

	  <footer>
		  <p>GameLog 2026</p>
	  </footer>

  
  </body>
</html>
